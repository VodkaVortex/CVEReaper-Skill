<div class="row"> <div class="col-xs-6 col-sm-4 col-md-3 col-lg-2 text-center" ng-repeat="video in videoList"> <a href="#/video/{{videoList.indexOf(video)}}"> <img class="img-thumbnail img-responsive col-lg-10 col-lg-offset-1>" ng-src="{{video.image}}"> </a> <br> <div class="col-lg-12"> <a class="title" href="#/video/{{videoList.indexOf(video)}}">{{video.title}}</a> <p class="label label-info">{{video.description}}</p> </div> </div> </div>
