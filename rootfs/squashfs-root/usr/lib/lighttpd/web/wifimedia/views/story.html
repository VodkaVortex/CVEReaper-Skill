<div class="row"> <div class="col-xs-6 col-sm-4 col-md-3 col-lg-2 text-center" ng-repeat="story in storyList"> <a href="{{story.url}}"> <img class="img-thumbnail img-responsive col-lg-10 col-lg-offset-1>" ng-src="{{story.image}}"> </a> <br> <div class="col-lg-12"> <a class="title" href="{{story.url}}">{{story.name}}</a> <p class="label label-info">{{story.desc}}</p> </div> </div> </div>
