<div class="row"> <div class="col-xs-6 col-sm-4 col-md-3 col-lg-2 text-center" ng-repeat="game in gameList"> <a href="{{game.url}}"> <img class="img-thumbnail img-responsive col-lg-10 col-lg-offset-1>" ng-src="{{game.image}}"> </a> <br> <div class="col-lg-12"> <a class="title" href="{{game.url}}">{{game.name}}</a> <p class="label label-info">{{game.desc}}</p> </div> </div> </div>
